    Used to define the web content with a

             <!---    WHAT IS ATTRIBUTE -->
    <!--
    
    A tags additional information called attribute.

    All the attributes will be given only one opening tag.

    Mostly all the tag will have common attributes

    Following are the common attribute:

    1. class    - it is a addition info that helps to identify collection of tags

    2. title    - it is a text that shown when we move mouse on a tag

    3. id      - it is a addition info that helps to identify specific tags in a unique way
                 Id must be unqiue for all the tag.

    4. style   - adds style to a particular tag

    EX:

    <p class="para1" id="para"  title="sample msg">Hello world</p>

    <h1 class="heading1" id="para_1"></h1>

    
    -->


    <!--     BASIC STRUCTURE OF HTML DOC -->

    html version type

    head tag  close head tag

    <meta title="Sample title" keyword="amazon">

    title - controls the website title which showed on browser when
            user make a search on our website
